<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='32' fill='%23e53935'/><path d='M21 44V20h6l10 14V20h6v24h-6L27 30v14z' fill='%23fff'/></svg>">
<link rel="apple-touch-icon" href="icon.png">
<title>블로그 포스트 스토리</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--canvas:#fff;--parchment:#f5f5f7;--ink:#1d1d1f;--muted:#7a7a7a;--hairline:#e0e0e0;--primary:#0066cc;--focus:#0071e3;--shadow:rgba(0,0,0,.22) 3px 5px 30px 0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--parchment);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Inter',sans-serif;font-size:17px;line-height:1.47;letter-spacing:-.374px}
  main{max-width:480px;margin:0 auto;padding:48px 16px 64px}
  header{text-align:center;margin-bottom:32px}
  h1{font-size:34px;font-weight:600;line-height:1.1;letter-spacing:-.374px;margin:0 0 8px}
  p.hint{margin:0;font-size:21px;font-weight:400;line-height:1.19;letter-spacing:.231px;color:var(--ink)}
  .preview{background:var(--canvas);aspect-ratio:1080/1920;width:78%;margin:0 auto;box-shadow:var(--shadow)}
  canvas{width:100%;height:100%;display:block}
  .panel{margin-top:48px;display:grid;gap:12px}
  .card{background:var(--canvas);border:1px solid var(--hairline);border-radius:18px;padding:24px;display:grid;gap:17px}
  .title{font-size:14px;font-weight:600;line-height:1.29;letter-spacing:-.224px}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;font:inherit;font-size:14px;letter-spacing:-.224px;padding:12px 16px;border-radius:9999px;background:var(--canvas);color:var(--ink);border:1px solid var(--hairline)}
  .seg button.on{border:2px solid var(--focus);padding:11px 15px}
  input[type=text],input[type=number]{width:100%;font:inherit;padding:12px 20px;height:44px;border:1px solid rgba(0,0,0,.08);border-radius:9999px;background:var(--canvas);color:var(--ink)}
  .file{display:block;text-align:center;color:var(--primary);cursor:pointer}
  .file input{display:none}
  .row{display:flex;align-items:center;justify-content:space-between}
  .row input[type=number]{width:80px;text-align:center;padding:0 12px}
  .row input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary)}
  .cta{justify-self:center;border:0;background:var(--primary);color:#fff;font:inherit;padding:11px 22px;border-radius:9999px;margin-top:20px;min-height:44px}
  button,.file{transition:transform .1s}
  button:active,.file:active{transform:scale(.95)}
  button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style>
<script>
// Google Analytics 4 — 측정 ID(G-XXXX)를 넣으면 방문자·MAU 집계 시작
const GA_ID='G-YW2PXJ52XE';
if(GA_ID){const t=document.createElement('script');t.async=1;t.src='https://www.googletagmanager.com/gtag/js?id='+GA_ID;document.head.appendChild(t)}
window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}
gtag('js',new Date());if(GA_ID)gtag('config',GA_ID);
</script>
</head>
<body>
<main>
  <header>
    <h1>포스트 쓴 척.</h1>
    <p class="hint">블로그엔 안 올리고, 스토리에만.</p>
  </header>

  <div class="preview"><canvas id="cv" width="1080" height="1920"></canvas></div>

  <div class="panel">
    <div class="card">
      <div class="title">레이아웃</div>
      <div class="seg" id="mode">
        <button data-m="1" class="on">사진 1장</button>
        <button data-m="4">네컷</button>
      </div>
      <label class="file" id="fileLabel">사진 고르기 ›<input id="file" type="file" accept="image/*" multiple></label>
    </div>
    <div class="card">
      <div class="title">캡션</div>
      <input id="cap" type="text" value="머리 이쁘다." maxlength="60" aria-label="캡션">
      <div class="row"><label for="bw">흑백</label><input id="bw" type="checkbox"></div>
    </div>
    <div class="card">
      <div class="title">공감 · 댓글 · 공유</div>
      <div class="row"><label for="bar">하단 바 표시</label><input id="bar" type="checkbox" checked></div>
      <div class="row"><label for="likes">공감</label><input id="likes" type="number" min="0" value="24" inputmode="numeric"></div>
      <div class="row"><label for="cmts">댓글</label><input id="cmts" type="number" min="0" value="7" inputmode="numeric"></div>
    </div>
    <button class="cta" id="save">스토리 이미지 저장</button>
  </div>
</main>
<script>
const W=1080,H=1920,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let mode=1,imgs=[];const pad0=60;

document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));
  mode=+b.dataset.m;
  document.getElementById('fileLabel').firstChild.textContent=mode===1?'사진 고르기 ›':'사진 4장 고르기 ›';
  draw();
});
document.getElementById('file').onchange=async e=>{
  const files=[...e.target.files].slice(0,4);
  imgs=await Promise.all(files.map(f=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=URL.createObjectURL(f)})));
  draw();
};
['cap','bw','bar','likes','cmts'].forEach(id=>document.getElementById(id).oninput=draw);

function cover(img,x,y,w,h){
  const s=Math.max(w/img.width,h/img.height),sw=w/s,sh=h/s;
  ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,x,y,w,h);
}
function placeholder(x,y,w,h){
  ctx.fillStyle='#eceef1';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#b0b5bc';ctx.font='700 34px "Nanum Gothic"';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('사진',x+w/2,y+h/2);
}
function draw(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  const pad=60,pw=W-pad*2;let ph;
  if(mode===1){
    const img=imgs[0];
    ph=img?Math.min(pw*img.height/img.width,1200):pw*0.75;
  }else ph=pw*0.78;
  const top=Math.max(80,(1635-ph)/2-30);
  ctx.filter=document.getElementById('bw').checked?'grayscale(1)':'none';
  if(mode===1){
    imgs[0]?cover(imgs[0],pad,top,pw,ph):placeholder(pad,top,pw,ph);
  }else{
    const f=14;ctx.fillStyle='#111';ctx.fillRect(pad,top,pw,ph);
    const cw=(pw-f*3)/2,ch=(ph-f*3)/2;
    for(let i=0;i<4;i++){
      const x=pad+f+(i%2)*(cw+f),y=top+f+Math.floor(i/2)*(ch+f);
      imgs[i]?cover(imgs[i],x,y,cw,ch):placeholder(x,y,cw,ch);
    }
  }
  ctx.filter='none';
  ctx.fillStyle='#777';ctx.font='30px "Nanum Gothic"';ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText(document.getElementById('cap').value,W/2,top+ph+48);
  if(document.getElementById('bar').checked) drawBar();
}
function drawBar(){
  const v=id=>+document.getElementById(id).value||0, y=1725, g='#333';
  ctx.fillStyle='#fff';ctx.fillRect(0,1635,W,285);
  ctx.fillStyle='#ececec';ctx.fillRect(0,1635,W,2);
  ctx.save();ctx.translate(80,y);ctx.scale(1.2,1.2);ctx.translate(-80,-y);
  ctx.strokeStyle=g;ctx.lineWidth=3.2;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.fillStyle=g;ctx.font='30px "Nanum Gothic"';ctx.textAlign='left';ctx.textBaseline='middle';
  let x=80;
  // heart
  const HP=new Path2D('M12 20.5C12 20.5 2.5 14.6 2.5 8.6 2.5 5.6 4.8 3.5 7.4 3.5 9.4 3.5 11.1 4.7 12 6.4 12.9 4.7 14.6 3.5 16.6 3.5 19.2 3.5 21.5 5.6 21.5 8.6 21.5 14.6 12 20.5 12 20.5Z');
  const heart=(px,py,k,fn)=>{ctx.save();ctx.translate(px,py);ctx.scale(k,k);fn();ctx.restore()};
  heart(x-4,y-33,2.8,()=>{ctx.lineWidth=1.3;ctx.stroke(HP)});
  x+=80;
  heart(x,y-20,1.7,()=>{ctx.fillStyle='#f2477d';ctx.fill(HP);ctx.save();ctx.clip(HP);ctx.fillStyle='#fb8fb2';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(13,0);ctx.lineTo(6,24);ctx.lineTo(0,24);ctx.fill();ctx.restore()});
  ctx.fillStyle='#555';x+=46;ctx.fillText(v('likes'),x,y);x+=ctx.measureText(v('likes')).width+28;
  // comment bubble
  x+=10;ctx.beginPath();ctx.arc(x+30,y,27,Math.PI*0.72,Math.PI*2.62);ctx.lineTo(x+4,y+28);ctx.closePath();ctx.stroke();
  for(const d of[-11,0,11]){ctx.beginPath();ctx.arc(x+30+d,y,3.2,0,7);ctx.fill()}
  x+=72;ctx.fillText(v('cmts'),x,y);x+=ctx.measureText(v('cmts')).width+28;
  // paper plane
  x+=10;ctx.beginPath();ctx.moveTo(x,y-6);ctx.lineTo(x+56,y-26);ctx.lineTo(x+36,y+30);ctx.lineTo(x+26,y+4);ctx.closePath();
  ctx.moveTo(x+26,y+4);ctx.lineTo(x+56,y-26);ctx.stroke();
  ctx.restore();
}
document.getElementById('save').onclick=()=>{gtag('event','save_story',{layout:mode===1?'single':'four_cut'});cv.toBlob(async blob=>{
  const file=new File([blob],'blog-story.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();
},'image/png')};
document.fonts.load('30px "Nanum Gothic"').then(draw);draw();
</script>
</body>
</html>
